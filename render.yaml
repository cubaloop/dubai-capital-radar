services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: dubai-capital-radar-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard secrets

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: dubai-capital-radar-frontend
    env: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dubai-capital-radar-backend
          property: host
